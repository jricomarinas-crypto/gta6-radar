name: Radar GTA 6

on:
  schedule:
    - cron: "17 * * * *"        # cada hora (si tu repo es privado, usa "17 */2 * * *")
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datos-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar datos anteriores
        run: bash tools/datos_git.sh traer

      - name: Ejecutar el Radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m radar.run

      - name: Guardar datos
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/datos_git.sh guardar

      - name: Preparar panel para GitHub Pages
        if: ${{ vars.PUBLICAR_PANEL == 'si' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar panel como descarga
        if: ${{ vars.PUBLICAR_PANEL != 'si' }}
        uses: actions/upload-artifact@v4
        with:
          name: panel
          path: site/index.html
          retention-days: 2

  publicar-panel:
    needs: radar
    if: ${{ vars.PUBLICAR_PANEL == 'si' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
